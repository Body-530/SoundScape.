<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoundScape — Visual Music Sequencer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #0A0C11;
    --bg-1: #12151C;
    --bg-2: #1A1E27;
    --line: #262B36;
    --line-strong: #363C4A;
    --text-hi: #EEEFF3;
    --text-mid: #A6ABBA;
    --text-low: #656B7C;

    --nature: #46B893;
    --nature-dim: #1E3A32;
    --chip: #F2B23E;
    --chip-dim: #453017;
    --lofi: #E06B93;
    --lofi-dim: #3E202C;
    --orch: #A98CE8;
    --orch-dim: #2C2540;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-0);
    color: var(--text-hi);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 32px 20px 60px;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
  }

  /* ---------- header ---------- */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 28px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .brand .mark {
    display: inline-flex;
    gap: 3px;
    align-items: flex-end;
  }
  .brand .mark span {
    width: 4px;
    background: var(--nature);
    display: inline-block;
    border-radius: 1px;
    animation: markbeat 1.6s ease-in-out infinite;
  }
  .brand .mark span:nth-child(1){height:10px; background:var(--nature); animation-delay:0s;}
  .brand .mark span:nth-child(2){height:18px; background:var(--chip); animation-delay:.15s;}
  .brand .mark span:nth-child(3){height:8px; background:var(--lofi); animation-delay:.3s;}
  .brand .mark span:nth-child(4){height:14px; background:var(--orch); animation-delay:.45s;}
  @keyframes markbeat {
    0%, 100% { transform: scaleY(0.6); }
    50% { transform: scaleY(1); }
  }

  .tagline {
    font-size: 13px;
    color: var(--text-low);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ---------- stage (grid + visualizer) ---------- */
  .stage {
    position: relative;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 20px 20px;
    overflow: hidden;
  }

  #viz {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }

  .grid-area {
    position: relative;
    z-index: 2;
  }

  .row {
    display: grid;
    grid-template-columns: 108px repeat(16, 1fr);
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }

  .row-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-mid);
    white-space: nowrap;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.nature { background: var(--nature); }
  .dot.chip { background: var(--chip); }
  .dot.lofi { background: var(--lofi); }
  .dot.orch { background: var(--orch); }

  .step {
    aspect-ratio: 1;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    cursor: pointer;
    transition: transform 0.08s ease, background 0.12s ease, border-color 0.12s ease;
    padding: 0;
  }
  .step:hover { border-color: var(--line-strong); }
  .step:active { transform: scale(0.9); }
  .step:focus-visible { outline: 2px solid var(--text-hi); outline-offset: 2px; }

  .step.beat-marker { border-left: 1px solid var(--line-strong); }

  .step.on.nature { background: var(--nature); border-color: var(--nature); box-shadow: 0 0 10px -2px var(--nature); }
  .step.on.chip { background: var(--chip); border-color: var(--chip); box-shadow: 0 0 10px -2px var(--chip); }
  .step.on.lofi { background: var(--lofi); border-color: var(--lofi); box-shadow: 0 0 10px -2px var(--lofi); }
  .step.on.orch { background: var(--orch); border-color: var(--orch); box-shadow: 0 0 10px -2px var(--orch); }

  .step.playhead { border-color: var(--text-hi); }

  /* ---------- transport ---------- */
  .transport {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 22px;
    flex-wrap: wrap;
  }

  button.transport-btn {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 500;
    background: var(--bg-2);
    color: var(--text-hi);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.06s ease;
  }
  button.transport-btn:hover { background: #232834; }
  button.transport-btn:active { transform: scale(0.96); }

  #playBtn {
    background: var(--text-hi);
    color: var(--bg-0);
    border-color: var(--text-hi);
    min-width: 92px;
  }
  #playBtn:hover { background: #d8d9de; }
  #playBtn.playing { background: var(--lofi); border-color: var(--lofi); color: #2a0f1a; }
  #playBtn.playing:hover { background: #e785a4; }

  .field {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-mid);
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 110px;
    height: 3px;
    background: var(--line-strong);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--text-hi);
    cursor: pointer;
    margin-top: -5px;
  }
  input[type="range"]::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--text-hi);
    border: none;
    cursor: pointer;
  }
  input[type="range"]::-moz-range-track {
    height: 3px;
    background: var(--line-strong);
    border-radius: 2px;
  }

  .tempo-val, .vol-val {
    color: var(--text-hi);
    min-width: 46px;
  }

  .spacer { flex: 1; }

  /* ---------- legend / theme note ---------- */
  .legend {
    display: flex;
    gap: 20px;
    margin-top: 18px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--text-low);
  }
  .legend .item { display: flex; align-items: center; gap: 6px; }

  footer {
    margin-top: 20px;
    text-align: center;
    font-size: 12px;
    color: var(--text-low);
    font-family: 'JetBrains Mono', monospace;
  }

  @media (max-width: 640px) {
    .row { grid-template-columns: 70px repeat(16, 1fr); gap: 4px; }
    .row-label { font-size: 9px; }
    .row-label span.full { display: none; }
    .brand h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="brand">
      <span class="mark"><span></span><span></span><span></span><span></span></span>
      <h1>SoundScape</h1>
    </div>
    <div class="tagline">visual music sequencer</div>
  </header>

  <div class="stage">
    <canvas id="viz"></canvas>

    <div class="grid-area">
      <div class="row" data-row="0">
        <div class="row-label"><span class="dot nature"></span><span class="full">nature</span></div>
      </div>
      <div class="row" data-row="1">
        <div class="row-label"><span class="dot chip"></span><span class="full">chiptune</span></div>
      </div>
      <div class="row" data-row="2">
        <div class="row-label"><span class="dot lofi"></span><span class="full">lo-fi</span></div>
      </div>
      <div class="row" data-row="3">
        <div class="row-label"><span class="dot orch"></span><span class="full">strings</span></div>
      </div>
    </div>

    <div class="transport">
      <button class="transport-btn" id="playBtn">Play</button>
      <button class="transport-btn" id="clearBtn">Clear</button>
      <button class="transport-btn" id="randomBtn">Randomize</button>

      <div class="field">
        <span>tempo</span>
        <input type="range" id="tempoSlider" min="60" max="180" value="112" step="1">
        <span class="tempo-val" id="tempoVal">112 bpm</span>
      </div>

      <div class="spacer"></div>

      <div class="field">
        <span>vol</span>
        <input type="range" id="volSlider" min="0" max="100" value="70" step="1">
        <span class="vol-val" id="volVal">70%</span>
      </div>
    </div>
  </div>

  <div class="legend">
    <div class="item"><span class="dot nature"></span>soft wind pluck</div>
    <div class="item"><span class="dot chip"></span>8-bit blip</div>
    <div class="item"><span class="dot lofi"></span>dusty tape thump</div>
    <div class="item"><span class="dot orch"></span>pizzicato string</div>
  </div>

  <footer>click steps to build a pattern — press play</footer>

</div>

<script>
(function () {
  const NUM_STEPS = 16;
  const ROW_THEMES = ['nature', 'chip', 'lofi', 'orch'];
  const ROW_COLORS = {
    nature: '#46B893',
    chip:   '#F2B23E',
    lofi:   '#E06B93',
    orch:   '#A98CE8'
  };

  // ---------- build grid ----------
  const rows = document.querySelectorAll('.row');
  const pattern = ROW_THEMES.map(() => new Array(NUM_STEPS).fill(false));
  const stepEls = ROW_THEMES.map(() => []);

  rows.forEach((rowEl, rowIndex) => {
    const theme = ROW_THEMES[rowIndex];
    for (let i = 0; i < NUM_STEPS; i++) {
      const btn = document.createElement('button');
      btn.className = 'step' + (i % 4 === 0 ? ' beat-marker' : '');
      btn.setAttribute('aria-label', theme + ' step ' + (i + 1));
      btn.addEventListener('click', () => {
        pattern[rowIndex][i] = !pattern[rowIndex][i];
        btn.classList.toggle('on', pattern[rowIndex][i]);
        btn.classList.toggle(theme, pattern[rowIndex][i]);
      });
      rowEl.appendChild(btn);
      stepEls[rowIndex].push(btn);
    }
  });

  // ---------- audio engine ----------
  let audioCtx = null;
  let masterGain = null;

  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = parseFloat(volSlider.value) / 100;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function noiseBuffer(duration) {
    const len = Math.floor(audioCtx.sampleRate * duration);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }

  function playNature(t) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(520, t);
    osc.frequency.exponentialRampToValueAtTime(220, t + 0.35);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.5, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    osc.connect(gain).connect(masterGain);
    osc.start(t);
    osc.stop(t + 0.42);

    const noise = audioCtx.createBufferSource();
    noise.buffer = noiseBuffer(0.15);
    const nf = audioCtx.createBiquadFilter();
    nf.type = 'highpass';
    nf.frequency.value = 3000;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.15, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    noise.connect(nf).connect(ng).connect(masterGain);
    noise.start(t);
  }

  function playChip(t) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(392, t);
    gain.gain.setValueAtTime(0.28, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    osc.connect(gain).connect(masterGain);
    osc.start(t);
    osc.stop(t + 0.13);
  }

  function playLofi(t) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(110, t);
    gain.gain.setValueAtTime(0.4, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    osc.connect(gain).connect(masterGain);
    osc.start(t);
    osc.stop(t + 0.32);

    const noise = audioCtx.createBufferSource();
    noise.buffer = noiseBuffer(0.08);
    const nf = audioCtx.createBiquadFilter();
    nf.type = 'lowpass';
    nf.frequency.value = 1200;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.1, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    noise.connect(nf).connect(ng).connect(masterGain);
    noise.start(t);
  }

  function playOrch(t) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(330, t);
    gain.gain.setValueAtTime(0.32, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    osc.connect(gain).connect(masterGain);
    osc.start(t);
    osc.stop(t + 0.52);
  }

  const PLAYERS = { nature: playNature, chip: playChip, lofi: playLofi, orch: playOrch };

  // ---------- visualizer ----------
  const canvas = document.getElementById('viz');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    const stage = document.querySelector('.stage');
    canvas.width = stage.clientWidth * devicePixelRatio;
    canvas.height = stage.clientHeight * devicePixelRatio;
    canvas.style.width = stage.clientWidth + 'px';
    canvas.style.height = stage.clientHeight + 'px';
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function spawnBurst(rowIndex, colIndex) {
    const stage = document.querySelector('.stage');
    const stepEl = stepEls[rowIndex][colIndex];
    const stageRect = stage.getBoundingClientRect();
    const stepRect = stepEl.getBoundingClientRect();
    const cx = (stepRect.left - stageRect.left + stepRect.width / 2) * devicePixelRatio;
    const cy = (stepRect.top - stageRect.top + stepRect.height / 2) * devicePixelRatio;
    const color = ROW_COLORS[ROW_THEMES[rowIndex]];

    for (let i = 0; i < 10; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (0.6 + Math.random() * 2.2) * devicePixelRatio;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.012 + Math.random() * 0.012,
        size: (2 + Math.random() * 3) * devicePixelRatio,
        color
      });
    }
    particles.push({ x: cx, y: cy, ring: 0, ringMax: 60 * devicePixelRatio, life: 1, decay: 0.03, color, isRing: true });
  }

  function drawViz() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.life -= p.decay;
      if (p.isRing) {
        p.ring += 3 * devicePixelRatio;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.ring, 0, Math.PI * 2);
        ctx.strokeStyle = hexToRgba(p.color, Math.max(p.life, 0) * 0.5);
        ctx.lineWidth = 1.5 * devicePixelRatio;
        ctx.stroke();
      } else {
        p.x += p.vx;
        p.y += p.vy;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * Math.max(p.life, 0), 0, Math.PI * 2);
        ctx.fillStyle = hexToRgba(p.color, Math.max(p.life, 0) * 0.8);
        ctx.fill();
      }
    });
    particles = particles.filter(p => p.life > 0);
    requestAnimationFrame(drawViz);
  }
  requestAnimationFrame(drawViz);

  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // ---------- sequencer clock ----------
  const playBtn = document.getElementById('playBtn');
  const clearBtn = document.getElementById('clearBtn');
  const randomBtn = document.getElementById('randomBtn');
  const tempoSlider = document.getElementById('tempoSlider');
  const tempoVal = document.getElementById('tempoVal');
  const volSlider = document.getElementById('volSlider');
  const volVal = document.getElementById('volVal');

  let isPlaying = false;
  let currentStep = 0;
  let nextNoteTime = 0;
  let schedulerId = null;
  const scheduleAheadTime = 0.1;
  const lookahead = 25;

  function bpm() { return parseFloat(tempoSlider.value); }
  function stepDuration() { return (60 / bpm()) / 4; }

  function scheduler() {
    while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
      scheduleStep(currentStep, nextNoteTime);
      nextNoteTime += stepDuration();
      currentStep = (currentStep + 1) % NUM_STEPS;
    }
    schedulerId = setTimeout(scheduler, lookahead);
  }

  const pendingHighlights = [];

  function scheduleStep(step, time) {
    ROW_THEMES.forEach((theme, rowIndex) => {
      if (pattern[rowIndex][step]) {
        PLAYERS[theme](time);
        pendingHighlights.push({ step, rowIndex, time });
      } else {
        pendingHighlights.push({ step, rowIndex, time, silent: true });
      }
    });
  }

  function visualLoop() {
    if (!audioCtx) { requestAnimationFrame(visualLoop); return; }
    const now = audioCtx.currentTime;
    while (pendingHighlights.length && pendingHighlights[0].time <= now) {
      const h = pendingHighlights.shift();
      if (h.rowIndex === 0) highlightColumn(h.step);
      if (!h.silent) spawnBurst(h.rowIndex, h.step);
    }
    requestAnimationFrame(visualLoop);
  }
  requestAnimationFrame(visualLoop);

  let lastPlayheadCol = -1;
  function highlightColumn(col) {
    if (lastPlayheadCol >= 0) {
      stepEls.forEach(row => row[lastPlayheadCol].classList.remove('playhead'));
    }
    stepEls.forEach(row => row[col].classList.add('playhead'));
    lastPlayheadCol = col;
  }

  function startPlayback() {
    ensureAudio();
    isPlaying = true;
    currentStep = 0;
    nextNoteTime = audioCtx.currentTime + 0.05;
    scheduler();
    playBtn.textContent = 'Stop';
    playBtn.classList.add('playing');
  }

  function stopPlayback() {
    isPlaying = false;
    clearTimeout(schedulerId);
    playBtn.textContent = 'Play';
    playBtn.classList.remove('playing');
    if (lastPlayheadCol >= 0) {
      stepEls.forEach(row => row[lastPlayheadCol].classList.remove('playhead'));
      lastPlayheadCol = -1;
    }
    pendingHighlights.length = 0;
  }

  playBtn.addEventListener('click', () => {
    if (isPlaying) stopPlayback(); else startPlayback();
  });

  clearBtn.addEventListener('click', () => {
    pattern.forEach((row, r) => row.forEach((_, c) => {
      pattern[r][c] = false;
      stepEls[r][c].classList.remove('on', ROW_THEMES[r]);
    }));
  });

  randomBtn.addEventListener('click', () => {
    pattern.forEach((row, r) => row.forEach((_, c) => {
      const on = Math.random() < 0.22;
      pattern[r][c] = on;
      stepEls[r][c].classList.toggle('on', on);
      stepEls[r][c].classList.toggle(ROW_THEMES[r], on);
    }));
  });

  tempoSlider.addEventListener('input', () => {
    tempoVal.textContent = tempoSlider.value + ' bpm';
  });

  volSlider.addEventListener('input', () => {
    volVal.textContent = volSlider.value + '%';
    if (masterGain) masterGain.gain.value = parseFloat(volSlider.value) / 100;
  });

  // seed a starter pattern so it's not silent on first play
  const starter = [
    [0,4,8,12],
    [2,6,10,14],
    [0,8],
    [3,7,11,15]
  ];
  starter.forEach((cols, r) => cols.forEach(c => {
    pattern[r][c] = true;
    stepEls[r][c].classList.add('on', ROW_THEMES[r]);
  }));
})();
</script>
</body>
</html>
